qlib_init:
  provider_uri: "data/cn_data"
  region: cn

market: &market csipan
benchmark: &benchmark SH000300

data_handler_config: &data_handler_config
  start_time: 2018-01-01
  end_time: 2024-12-31
  fit_start_time: 2018-01-01
  fit_end_time: 2022-12-31
  instruments: *market
  
  # === 特征工程 (Feature Engineering) ===
  class: "DataHandlerLP"
  module_path: "qlib.data.dataset.handler"
  kwargs:
    instruments: *market
    infer_processors:
      - class: "RobustZScoreNorm"
        kwargs: {fields_group: feature, clip_outlier: true}
      - class: "Fillna"
        kwargs: {fields_group: feature}
    learn_processors:
      - class: "DropnaLabel"
      - class: "CSRankNorm" # 排名化 Label，抗大盘波动
        kwargs: {fields_group: label}
    
    # === 因子列表 (这里简写，请按之前的方法补全 158+3 个) ===
    features:
      - "$close / Ref($close, 1) - 1"          # 自定义: 收益率
      - "$close / Mean($close, 5) - 1"         # 自定义: 均线偏离
      - "Std($close, 20) / Mean($close, 20)"   # 自定义: 波动率
      # ... (请在此处粘贴 Alpha158 的其他因子) ...
    
    label: ["Ref($close, -2) / Ref($close, 1) - 1"] # 预测 T+2 的收益

task:
  model:
    # 这里用 LightGBM 演示 (稳定、快)，想换 LSTM 改这里即可
    class: "LGBModel"
    module_path: "qlib.contrib.model.gbdt"
    kwargs:
      loss: "mse"
      colsample_bytree: 0.8879
      learning_rate: 0.0421
      subsample: 0.8789
      lambda_l1: 205
      lambda_l2: 580
      max_depth: 8
      num_leaves: 210
      num_threads: 20

# === 滚动训练配置 (Rolling Config) ===
rolling:
  step: 20         # 每 20 个交易日(约1个月) 滚动一次，模拟真实月度调仓
  horizon: 20      # 每次预测未来 20 天