qlib_init:
  # 注意：保持你之前成功的路径，不要照抄参考配置的 ~/.qlib
  provider_uri: "data/cn_data"
  region: cn

market: &market csi300
benchmark: &benchmark SH000300

data_handler_config: &data_handler_config
  # 1. 数据加载范围：涵盖所有可用数据
  start_time: 2005-01-04
  end_time: 2025-12-31
  # 2. 拟合区间 (Fit Time)：【非常关键】
  # 用于计算 RobustZScore 的均值和方差。
  # 必须严格截止在验证集结束的时间，不能偷看测试集(2024以后)的数据。
  fit_start_time: 2005-01-04
  fit_end_time: 2023-12-31
  instruments: *market

# ==========================================
# 回测策略配置
# ==========================================
port_analysis_config: &port_analysis_config
  strategy:
    class: TopkDropoutStrategy
    module_path: qlib.contrib.strategy
    kwargs:
      signal: <PRED>
      topk: 50     # 每日持有前50只股票
      n_drop: 5    # 每日轮换卖出排名下降的5只
  backtest:
    # 3. 回测区间：主要看最近两年的表现
    start_time: 2024-01-01
    end_time: 2025-12-26
    account: 100000000     # 初始资金 1亿
    benchmark: *benchmark
    exchange_kwargs:
      limit_threshold: 0.095 # 涨跌停限制
      deal_price: close      # 以收盘价成交
      open_cost: 0.0005      # 买入佣金 万5
      close_cost: 0.0015     # 卖出佣金+印花税 千1.5
      min_cost: 5            # 最低佣金 5元

task:
  model:
    class: "LGBModel"
    module_path: "qlib.contrib.model.gbdt"
    kwargs:
      loss: "mse"
      colsample_bytree: 0.8879
      learning_rate: 0.0421
      subsample: 0.8789
      lambda_l1: 205.6999
      lambda_l2: 580.9768
      max_depth: 8
      num_leaves: 210
      num_threads: 20

  dataset:
    class: "DatasetH"
    module_path: "qlib.data.dataset"
    kwargs:
      handler:
        class: "Alpha158"
        module_path: "qlib.contrib.data.handler"
        kwargs: *data_handler_config
      segments:
         # 4. 训练/验证/测试 切分
        train: [2005-01-04, 2022-12-31] # 主力训练数据
        valid: [2023-01-01, 2023-12-31] # 用于早停
        test:  [2024-01-01, 2025-12-26] # 纯样本外测试 (Out-of-sample)

  # ==========================================
  # 🆕 更新部分：添加 ModelRecord 以保存模型文件
  # ==========================================
  record: 
    # 2. 保存预测结果
    - class: SignalRecord
      module_path: qlib.workflow.record_temp
      kwargs: 
        model: <MODEL>
        dataset: <DATASET>
    
    # 3. 组合分析记录
    - class: SigAnaRecord
      module_path: qlib.workflow.record_temp
      kwargs: 
        ana_long_short: False
        ann_scaler: 252

    # 4. 回测记录
    - class: PortAnaRecord
      module_path: qlib.workflow.record_temp
      kwargs: 
        config: *port_analysis_config

# [新增] 滚动训练配置
rolling:
    enable: False
    step: 20           # 滚动步长 (天)，例如每 20 个交易日重新训练一次
    train_window: 242  # 训练窗口 (天)，每次训练使用过去 242 天的数据 (约1年)