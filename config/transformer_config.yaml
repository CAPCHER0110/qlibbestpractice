qlib_init:
  provider_uri: "data/cn_data"
  region: cn

market: &market csi300
benchmark: &benchmark SH000300

data_handler_config: &data_handler_config
  # 1. 数据加载范围：涵盖所有可用数据
  start_time: 2005-01-04
  end_time: 2025-12-31
  # 2. 拟合区间 (Fit Time)：【非常关键】
  # 用于计算 RobustZScore 的均值和方差。
  # 必须严格截止在验证集结束的时间，不能偷看测试集(2024以后)的数据。
  fit_start_time: 2005-01-04
  fit_end_time: 2023-12-31
  instruments: *market
  
  # ==========================================
  # 特征预处理 (全量 158 因子)
  # ==========================================
  infer_processors:
    - class: RobustZScoreNorm
      kwargs:
        fields_group: feature
        clip_outlier: true
        fit_start_time: 2005-01-04
        fit_end_time: 2023-12-31
    - class: Fillna
      kwargs:
        fields_group: feature

  learn_processors:
    - class: DropnaLabel
    - class: CSZScoreNorm
      kwargs:
        fields_group: label
  
  label: ["Ref($close, -2) / Ref($close, -1) - 1"]

port_analysis_config: &port_analysis_config
  strategy:
    class: TopkDropoutStrategy
    module_path: qlib.contrib.strategy
    kwargs:
      signal: <PRED>
      topk: 50
      n_drop: 5
  backtest:
    # 3. 回测区间：主要看最近两年的表现
    start_time: 2024-01-01
    end_time: 2025-12-26
    account: 100000000
    benchmark: *benchmark
    exchange_kwargs:
      limit_threshold: 0.095
      deal_price: close
      open_cost: 0.0005
      close_cost: 0.0015
      min_cost: 5

task:
  model:
    # ==========================================
    # 🆕 核心升级：Transformer 模型配置
    # ==========================================
    class: TransformerModel
    module_path: qlib.contrib.model.pytorch_transformer_ts
    kwargs:
      d_feat: 158         # 输入特征维度
      
      # --- Transformer 核心参数 ---
      d_model: 64         # 嵌入维度 (相当于 LSTM 的 hidden_size)
      n_head: 4           # 多头注意力的头数 (64 必须能被 4 整除)
      d_ffn: 128          # 前馈网络维度 (通常是 d_model 的 2倍或4倍)
      n_layers: 2         # Encoder 层数
      dropout: 0.1        # Transformer 容易过拟合，通常给一点 dropout
      
      n_epochs: 200
      lr: 0.001
      early_stop: 10
      batch_size: 1024     # Transformer 并行能力强，可以适当加大 batch_size
      metric: loss
      loss: mse
      
      n_jobs: 0           # 保持单进程
      GPU: 0              # ✅ RTX 5070 准备起飞

  dataset:
    # ==========================================
    # 数据集配置
    # ==========================================
    class: TSDatasetH
    module_path: qlib.data.dataset
    kwargs:
      handler:
        class: Alpha158
        module_path: qlib.contrib.data.handler
        kwargs: *data_handler_config
      segments:
         # 4. 训练/验证/测试 切分
        train: [2005-01-04, 2022-12-31] # 主力训练数据
        valid: [2023-01-01, 2023-12-31] # 用于早停
        test:  [2024-01-01, 2025-12-26] # 纯样本外测试 (Out-of-sample)
      # 5. 时间步长
      # 建议设为 40 或 60，让 LSTM 看过去 2-3 个月的走势
      step_len: 60

  record: 
    - class: SignalRecord
      module_path: qlib.workflow.record_temp
      kwargs: 
        model: <MODEL>
        dataset: <DATASET>
    - class: SigAnaRecord
      module_path: qlib.workflow.record_temp
      kwargs: 
        ana_long_short: False
        ann_scaler: 252
    - class: PortAnaRecord
      module_path: qlib.workflow.record_temp
      kwargs: 
        config: *port_analysis_config